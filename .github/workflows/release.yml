# Publishing, triggered by the tag and authenticated by nobody.
#
# `check.yml` deferred this and said why: a publish pipeline debugged during
# the first publish is two problems at once. That was right, and the first
# publish has happened — 0.1.0 went up by hand on 2026-09-09 — so the reason
# has expired rather than been overruled.
#
# NO NPM TOKEN. This publishes over OIDC, which npm calls trusted publishing:
# GitHub mints a short-lived identity token for this workflow, npm checks it
# against the publisher configured on the package, and nothing long-lived is
# stored anywhere. The alternative was an automation token in a repository
# secret — a credential that publishes to npm under a human's name, sitting in
# CI, bypassing that human's 2FA. This project's whole argument is about that
# class of credential. Shipping one to save a config screen would be the tool
# contradicting its own README.
#
# The payoff is not only the absent secret. Publishing this way attaches a
# provenance attestation: a signed statement tying the bytes on the registry to
# this repository, this workflow and this commit. It is automatic and there is
# no flag for it — public repository, public package and OIDC are the whole
# requirement, and all three hold. A tool that sells a recorded link between an
# artefact and where it came from should carry one.
#
# CONFIGURED OFF-REPOSITORY, WHICH IS THE FAILURE MODE. npm holds the trusted
# publisher on the package settings page and does not validate it when saved,
# so a wrong workflow filename there is silent until a release fails. This file
# must stay named `release.yml`, or the setting has to change with it.
#
# The gate is not repeated here. `npm publish` runs `prepublishOnly`, which is
# `node check.mjs` — every gate, including the smoke gate that packs and
# installs the tarball — and a failure there aborts before anything reaches the
# registry. Running it as a separate job first would be a second copy of the
# same question, and the copy that ran would not be the one guarding the
# publish.

name: release

# A tag is the release trigger. `workflow_dispatch` exists so the identity
# half can be exercised without one: the first two attempts each burned eight
# minutes and a tag to learn one fact about authentication, which is the
# problem check.yml warned about — a publish pipeline debugged during a publish.
# Dispatched without `publish`, this runs every check and stops before the
# registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'publish, rather than stopping after the identity checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A tag is a claim about which bytes a version is. This job is the only thing
  # standing between a mistyped tag and a wrong number on the registry, where it
  # cannot be corrected without burning another version.
  agree:
    name: the tag, the manifest and the changelog agree
    # Only a tag can disagree with anything. A dispatched run has no version to
    # check, so this is skipped rather than made to pass on an exception —
    # a gate with a bypass in it stops being a gate.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          # Through the environment rather than `${{ }}` in the script body,
          # for the reason commit-style.yml gives: substitution happens before
          # the shell sees it, and a ref name is not this workflow's to trust.
          TAG: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const { readFileSync } = require('node:fs')
          const tag = process.env.TAG ?? ''
          const fail = (why, hint) => {
            console.error(`refused: ${why}`)
            if (hint) console.error(`  ${hint}`)
            process.exit(1)
          }

          // Tags carry the `v` and the manifest does not. CHANGELOG.md says so
          // in its own header, and this is where that sentence is enforced.
          if (!/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(tag)) {
            fail(`\`${tag}\` is not a release tag`, 'expected v<major>.<minor>.<patch>')
          }
          const version = tag.slice(1)

          const manifest = JSON.parse(readFileSync('package.json', 'utf8')).version
          if (manifest !== version) {
            fail(`the tag says ${version} and package.json says ${manifest}`,
                 'tag the commit that carries the version, or bump the version first')
          }

          // The heading, not a mention. `## 0.1.1 — 2026-09-09` is the shape
          // CHANGELOG.md already uses, and an entry with no date is an entry
          // for a release that has not happened.
          const log = readFileSync('CHANGELOG.md', 'utf8')
          const heading = new RegExp(`^## ${version.replace(/\./g, '\\.')} — \\d{4}-\\d{2}-\\d{2}$`, 'm')
          if (!heading.test(log)) {
            fail(`CHANGELOG.md has no dated entry for ${version}`,
                 `expected a line: ## ${version} — YYYY-MM-DD`)
          }

          console.log(`${tag} · package.json ${manifest} · CHANGELOG.md entry present`)
          EOF

  publish:
    name: publish to npm with provenance
    needs: agree
    # `needs` alone would skip this whenever `agree` is skipped, which is every
    # dispatched run. Skipped is not failed, and only failed should stop it.
    if: ${{ !cancelled() && (needs.agree.result == 'success' || needs.agree.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole authentication story. Without it npm sees an anonymous
      # runner; with it, npm sees this workflow in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Not the supported floor. `engines` says node >=20 and check.yml tests
      # 20, 22 and 24, because that is what a consumer may run. Trusted
      # publishing needs node >=22.14 and npm >=11.5.1, and those are
      # requirements of the act of publishing rather than of the package.
      #
      # NO `registry-url`, and that is the whole lesson of the first attempt.
      # setup-node's registry-url writes an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}` and sets that variable to the literal
      # placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then finds credentials,
      # authenticates with a string that is not a token, and never tries OIDC
      # at all — the registry answers `404 Not Found - PUT`, because npm
      # returns 404 rather than 403 so publishing cannot be used to probe which
      # packages exist. Nothing in the log mentions OIDC, which is how you tell
      # this apart from a rejected identity.
      #
      # registry.npmjs.org is the default registry, so naming it bought
      # nothing and cost the release.
      #
      # v6, and not v4, which is the other half of the same failure. Trusted
      # publishing is not supported before v6 — removing registry-url stopped
      # npm being handed a fake credential, but the action still had no OIDC
      # support to offer, so npm went on publishing as nobody. The two look
      # identical from the log because npm reports both as ENEEDAUTH rather
      # than as a trusted-publishing diagnostic (npm/cli#9088), which is what
      # made this three failures instead of one.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The documented workaround, applied whole this time. registry-url is
      # kept because npm wants the registry configured in an .npmrc; what it
      # must not find there is the credential line the action writes beside it.
      # Removing registry-url instead took away both, and npm went on
      # publishing as nobody.
      - name: strip the credential setup-node wrote beside the registry
        run: |
          cfg="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ ! -f "$cfg" ]; then
            echo "refused: no .npmrc at $cfg — registry-url did not write one" >&2
            exit 1
          fi
          sed -i '/_authToken/d' "$cfg"
          # Never printed. The line is gone or it is not, and that is all this
          # needs to say; the file is a credential store even when the
          # credential in it is a placeholder.
          if grep -q "_authToken" "$cfg"; then
            echo "refused: _authToken survived the strip" >&2
            exit 1
          fi
          echo "registry configured, credential line removed"

      - name: npm is new enough to publish over OIDC
        run: |
          have=$(npm --version)
          need=11.5.1
          # sort -V, so 11.10 does not compare below 11.5.
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "refused: npm $have cannot use trusted publishing — $need or later is required" >&2
            echo "  the runner's bundled npm moved; pin node-version or add npm i -g npm@latest" >&2
            exit 1
          fi
          echo "npm $have"

      # Asserted rather than assumed, because assuming it is what broke the
      # first release. Any credential visible to npm here means it will
      # authenticate as that credential's owner instead of over OIDC —
      # publishing without provenance if the token is real, and failing with a
      # misleading 404 if it is a placeholder.
      - name: nothing is authenticating but OIDC
        env:
          # setup-node exports this as the literal placeholder
          # `XXXXX-XXXXX-XXXXX-XXXXX` whenever registry-url is set. Emptied
          # here rather than tolerated: the check below is the real assertion
          # and it should be allowed to fail if anything else sets this.
          NODE_AUTH_TOKEN: ''
        run: |
          bad=0
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "refused: NODE_AUTH_TOKEN is set — npm will use it instead of OIDC" >&2
            bad=1
          fi
          cfg="${NPM_CONFIG_USERCONFIG:-}"
          if [ -n "$cfg" ] && [ -f "$cfg" ] && grep -q "_authToken" "$cfg"; then
            echo "refused: $cfg configures _authToken — npm will use it instead of OIDC" >&2
            echo "  almost certainly setup-node's registry-url; remove it" >&2
            bad=1
          fi
          [ "$bad" -eq 0 ] || exit 1
          echo "no stored credential — the only identity here is this workflow's"

      # Fails in seconds, and before `npm publish` spends eight minutes in
      # prepublishOnly only to discover the same thing. npm's own error for
      # this is ENEEDAUTH — "you need to authorize this machine" — which
      # describes a laptop and not a runner, and sends you looking at the
      # registry rather than at the permission.
      # Two questions, asked here because npm will not answer either one.
      # `npm publish` reports every trusted-publishing failure as ENEEDAUTH,
      # "you need to authorize this machine using npm adduser" — a sentence
      # about a laptop — and prints nothing about OIDC whether it never tried
      # or tried and was refused (npm/cli#9088). Five releases failed on that
      # sentence. So the exchange is done here first, where the status code is
      # visible, and eight minutes of prepublishOnly are not spent to reach a
      # message that does not distinguish the causes.
      #
      # A 404 from the exchange is npm saying no trusted publisher matches this
      # workflow — not that the route is missing. That is the documented
      # behaviour and it is the difference between a repository problem and a
      # settings-page problem.
      #
      # No token is ever printed. The id_token goes into a header; the exchange
      # response is shown only when it is not 200, because a 200 body carries a
      # registry token.
      - name: npm will accept this workflow's identity
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "refused: no OIDC token endpoint in this job's environment" >&2
            echo "  id-token: write was requested and not granted" >&2
            exit 1
          fi

          id_token=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value // empty')
          if [ -z "$id_token" ]; then
            echo "refused: GitHub issued no id_token for audience npm:registry.npmjs.org" >&2
            exit 1
          fi
          echo "GitHub issued an id_token"

          pkg=$(node -p "require('./package.json').name")
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg")

          # Any 2xx. The exchange answers 201 — it creates a token — and an
          # equality test against 200 read that success as a failure. A probe
          # that reports a working system as broken is worse than no probe,
          # which is the second reason this step does not get to refuse.
          case "$code" in
            2*)
              echo "npm exchanged it ($code) — a trusted publisher matches this workflow"
              exit 0
              ;;
          esac

          # ADVISORY, NOT A GATE, and the distinction is the point. The route
          # above was taken from a search result rather than from npm's API
          # reference, and a check that might itself be wrong must not be able
          # to refuse a publish that would otherwise succeed. `npm publish` is
          # the authority on whether npm accepts this identity; this step only
          # gets to say what it saw on the way past.
          echo "note: the token exchange answered HTTP $code, which is not a success"
          echo "--- npm said ---"
          cat "$body"
          echo
          if [ "$code" = "404" ]; then
            echo "  If the publish below also fails, this is the likely cause:"
            echo "  no trusted publisher matching user JadRizk, repository qrntn,"
            echo "  workflow release.yml, environment empty."
            echo "  If the publish below SUCCEEDS, this probe's URL is wrong and"
            echo "  the step should be deleted rather than believed."
          fi

      - name: publish
        if: github.event_name == 'push' || inputs.publish
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish
