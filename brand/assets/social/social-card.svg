<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="qrntn — records and gates a human decision about an agent skill before it is allowed to load">
  <title>qrntn</title>
  <defs>
    <!-- The hazard rule the viewer already draws across its navbar. -->
    <pattern id="hazard" width="24" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <rect width="24" height="12" fill="#08090A"/>
      <rect width="12" height="12" fill="#FEDD00"/>
    </pattern>
    <!-- CRT scanlines, at the amplitude the tokens specify: 3px period. -->
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#08090A"/>
      <rect width="3" height="8" fill="#FEDD00"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#08090A"/>
  <rect x="0" y="0" width="1280" height="10" fill="url(#hazard)"/>

  <!-- The logotype. The leading q is signal flag Q on its descender; `rntn`
       follows in mono. textLength pins the measure to 4 x 90 so the word starts
       exactly one cell after the flag whatever mono the renderer resolves. -->
  <rect x="88" y="192" width="74" height="78" fill="#FEDD00"/>
  <rect x="162" y="192" width="14" height="111" fill="#FEDD00"/>
  <text x="178" y="270" textLength="360" lengthAdjust="spacing"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="150" font-weight="600" fill="#F2ECD9">rntn</text>

  <text x="88" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="28" fill="#BDB9AD">Records and gates a human decision about an</text>
  <text x="88" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="28" fill="#BDB9AD">agent skill before it is allowed to load.</text>

  <!-- The lifecycle, as the three states the flag can be in. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="3">
    <rect x="88" y="470" width="52" height="30" fill="url(#hatch)"/>
    <rect x="88" y="470" width="52" height="30" fill="none" stroke="#FEDD00" stroke-width="2"/>
    <text x="152" y="491" fill="#7F7966">HELD</text>

    <rect x="268" y="470" width="52" height="30" fill="#FEDD00"/>
    <text x="332" y="491" fill="#7F7966">CLEARED</text>

    <rect x="500" y="470" width="52" height="30" fill="none" stroke="#FF2E63" stroke-width="2"/>
    <path d="M500 500 L552 470" stroke="#FF2E63" stroke-width="3"/>
    <text x="564" y="491" fill="#7F7966">REFUSED</text>
  </g>

  <rect x="88" y="556" width="1104" height="1" fill="#38352D"/>
  <text x="88" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" letter-spacing="2" fill="#7F7966">pronounced quarantine · Apache-2.0 · github.com/JadRizk/qrntn</text>

  <rect width="1280" height="640" fill="url(#scan)"/>
</svg>
